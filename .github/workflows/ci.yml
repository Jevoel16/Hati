name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A throwaway TiDB for the integration tests; they create and drop their own databases.
    services:
      tidb:
        image: pingcap/tidb:v8.5.0
        ports:
          - 4000:4000
    env:
      TEST_DATABASE_URL: mysql://root@127.0.0.1:4000/test
      APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Wait for TiDB
        run: timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/4000) 2>/dev/null; do sleep 1; done'
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
